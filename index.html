<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/latest/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Brand Shop</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header-left">
                <div class="img-container header-logo-left"><img src="image/logo.svg" alt="Логотип" class="header-logo"></div>
                <div class="img-container list-logo"><img src="image/list.svg" alt="Логотип"></div>
                <div class="img-container search-logo-left"><img src="image/search.svg" alt="Логотип" class="search-logo"></div>
            </div>
            <div class="header-center">
                <div class="img-container header-logo-center"><img src="image/logo.svg" alt="Логотип"></div>
                <ul class="header-catalog">
                    <li class="header-catalog-elem"><p class="header-catalog-text">Одежда</p></li>
                    <li class="header-catalog-elem"><p class="header-catalog-text">Обувь</p></li>
                    <li class="header-catalog-elem"><p class="header-catalog-text">Аксесуары</p></li>
                    <li class="header-catalog-elem"><p class="header-catalog-text">Бренды</p></li>
                    <li class="header-catalog-elem"><p class="header-catalog-text">Расчет стоимости</p></li>
                    <li class="header-catalog-elem"><p class="header-catalog-text">Информация</p></li>
                </ul>
            </div>
            <div class="header-right">
                <ul class="header-list">
                    <li class="header-list-elem search-logo-right"><img src="image/search.svg" alt="Логотип"></li>
                    <li class="header-list-elem"><img src="image/star.svg" alt="Логотип" class="star-logo"></li>
                    <li class="header-list-elem"><img src="image/profile.svg" alt="Логотип" class="profile-logo"></li>
                    <li class="header-list-elem market-container">
                        <img src="image/market.svg" alt="Логотип" class="market">
                        <span class="market-text">11 899 ₽</span>
                        <div class="market-notification">7</div>
                    </li>
                </ul>
            </div>
        </header>
        <main class="main">
            <section class="hero">
                <div class="hero-top">
                    <h1 class="hero-title">Широкий<br>ассортимент<br>Одежды</h1>
                    <p class="hero-text">Одежда от известные брендов у нас в каталоге. Только качественные вещи.</p>
                    <button class="hero-button">
                        <span class="hero-button-text">Перейти в каталог</span>
                    </button>
                </div>
                <div class="hero-bottom">
                    <div class="swipe"><img src="image/hero-left-arrow.svg" alt="Картинка"></div>
                    <div class="swipe"><img src="image/hero-right-arrow.svg" alt="Картинка"></div>
                </div>
            </section>
            <section></section>
            <section></section>
            <section></section>
            <section></section>
        </main>
        <footer class="footer"></footer>
    </div>
</body>
</html>
